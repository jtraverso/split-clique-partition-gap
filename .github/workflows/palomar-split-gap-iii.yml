name: Split Gap III Palomar preflight
on:
  workflow_dispatch:
    inputs:
      authorization_relationship:
        description: Confirmed relationship to the substantive formalization
        type: choice
        required: true
        options:
          - I am a responsible author or maintainer
          - I have approval from a responsible author or maintainer
permissions:
  contents: read
jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: splitgapiii1
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        {"comparator_config_path":"formalization/SplitGapIII/comparator.json",
        "project_path":"formalization/SplitGapIII",
        "authorization_relationship":${{ toJSON(inputs.authorization_relationship) }}}
