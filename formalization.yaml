version: v0.4
project:
  name: "Nearly Quadratic Additive Gaps for Edge-Clique Partitions of Split Graphs"
  description: >-
    For all sufficiently large n there is an n-vertex split graph that stays
    connected after removing any set of fewer than ceiling(n/5) vertices.
    Its exact edge-clique partition number exceeds the fractional optimum by
    at least a positive constant times n^2 (log n)^(-5/2) times
    exp(-2 sqrt(log(24/7) log n)). The same lower bound holds with the fractional
    optimum restricted to cliques of order at most four. The construction
    combines a local triangle-packing obstruction, a signed weight estimate
    on affine blocks, and host assignments in a split graph.
  authors: ["Juan Pablo Traverso Gianini"]
  responsible_maintainers: ["Juan Pablo Traverso Gianini"]
  license: Apache-2.0
