fidelity:
  divergences: >-
    The main statement is an extension of the fixed-probability results of preprint 1.0.
    It uses a different indexed residual and proves a lower bound at a smaller survival
    scale. Reassignment and gap equality hold on the same event.
    The second statement writes the proper-label condition explicitly. It assumes the
    lists contain hosts adjacent to both endpoints and verifies that each chosen host lies
    in its own request's list.
