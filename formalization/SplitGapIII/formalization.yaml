version: "v0.4"
project:
  name: "Physical host recovery and gap preservation after random crossing-edge deletions"
  description: >-
    At every sufficiently large order n, we construct a split graph with an
    integral–fractional clique-partition gap of order at least (pn)^(3/2).
    If p^2 n exceeds an explicit constant times log n, independent survival of
    crossing edges with probability p leaves, with probability at least 1 - 2 n^(-8),
    both a complete physical reassignment and the same gap. The accompanying
    bipartite lemma explicitly chooses each host from its own surviving list.
  authors: ["Juan Pablo Traverso Gianini"]
  responsible_maintainers: ["Juan Pablo Traverso Gianini"]
  license: Apache-2.0
classification:
  arxiv: [math.CO]
  msc2020: ["05C70", "05C15", "05C80"]
sources:
  - title: "Recovering Host-Triangle Decompositions after Random Deletions in Split Graphs"
    authors: ["Juan Pablo Traverso Gianini"]
    id: "https://www.alphaxiv.org/abs/2611.host-triangle-decompositions-random-deletions"
    type: preprint
    location: "Split Gap III, preprint 1.0, Sections 3–4 and 7 (bipartite recovery and fixed-probability background)"
    relationship: formalizes
    author_endorsement: participated
  - title: "Stability of the Clique Partition Gap in Split Graphs"
    authors: ["Juan Pablo Traverso Gianini"]
    id: "doi:10.5281/zenodo.24452724"
    type: preprint
    location: "Split Gap II, Theorem 1 (exact transfer when all requests are assigned)"
    relationship: background
related_formalizations:
  - id: "https://github.com/jtraverso/split-clique-partition-gap/tree/a90196c3731998b8ffee9ae920a50db28aafd567/preprints/SPLITGAPIII"
    relationship: builds-on
    note: "The released formalization supplement contains the proofs in SplitGapIII.Reassignment and SplitGapIII.RecoveryProbability."
  - id: "PALOMAR-2026-10-20-000004"
    relationship: builds-on
    note: "The symmetric Lovász local lemma produces a conflict-free choice in the independent physical lists."
status:
  scope: >-
    The main declaration gives quantitative exact-gap recovery for indexed witnesses
    at a finite logarithmic supply threshold, including existence of the post-deletion
    assignment. The second declaration certifies membership in the prescribed bipartite
    lists. The fixed-p nearly quadratic bound, connectivity and statistical asymptotics
    of preprint 1.0 are outside the compared declarations.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
