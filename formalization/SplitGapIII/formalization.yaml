version: "v0.4"
project:
  name: "Physical host recovery and gap preservation after random crossing-edge deletions"
  description: >-
    In a split graph with a complete host assignment, suppose sufficient surviving
    host lists imply a complete reassignment. Under independent crossing-edge deletions,
    a sum of explicit binomial tail bounds controls the probability of changing the
    integral–fractional clique-partition gap. For a bipartite block, a proper midpoint
    labeling supplies the degree bound needed to recover an assignment from surviving
    physical host lists.
  authors: ["Juan Pablo Traverso Gianini"]
  responsible_maintainers: ["Juan Pablo Traverso Gianini"]
  license: Apache-2.0
classification:
  arxiv: [math.CO]
  msc2020: ["05C70", "05C15", "05C80"]
sources:
  - title: "Recovering Host-Triangle Decompositions after Random Deletions in Split Graphs"
    authors: ["Juan Pablo Traverso Gianini"]
    id: "https://www.alphaxiv.org/abs/2611.host-triangle-decompositions-random-deletions"
    type: preprint
    location: "Split Gap III, preprint 1.0, Sections 3–4 and 7 (bipartite recovery and finite probabilistic transfer)"
    relationship: formalizes
    author_endorsement: participated
  - title: "Stability of the Clique Partition Gap in Split Graphs"
    authors: ["Juan Pablo Traverso Gianini"]
    id: "doi:10.5281/zenodo.24452724"
    type: preprint
    location: "Split Gap II, Theorem 1 (exact transfer when all requests are assigned)"
    relationship: background
related_formalizations:
  - id: "https://github.com/jtraverso/split-clique-partition-gap/tree/a90196c3731998b8ffee9ae920a50db28aafd567/preprints/SPLITGAPIII"
    relationship: builds-on
    note: "The released formalization supplement contains the proofs in SplitGapIII.Reassignment and SplitGapIII.RecoveryProbability."
status:
  scope: >-
    The two compared declarations cover bipartite list recovery and the finite probabilistic
    transfer to the gap of the undeleted graph. The probability bound assumes a deterministic
    recovery rule. The full random-support theorem, the optimal Kp > 1 threshold, the quantitative
    lower bound and connectivity, and the statistical asymptotics are outside these declarations.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods:
    - method: agent
      models: ["ChatGPT/Codex (OpenAI)"]
      framework: Codex
      tool_setup: "Prepared and checked the independent statement and proof interface for the two declarations using Lean 4."
      cost: {wall_time: "not tracked", spend_usd: "not tracked", hardware: "local machine"}
      prompting_notes: "The submission interface was prepared at the request of the author."
  spend_usd: "not tracked"
fidelity:
  divergences: >-
    The first statement composes the freeze's probability_gap_deviation with gap_of_complete_recovery
    to compare against the undeleted graph, rather than its residual optimum difference.
    The second statement writes the proper-label condition explicitly. It assumes that the
    lists contain hosts adjacent to both endpoints and that enough of those hosts survive.
review:
  status: agent-reviewed
  reviewers: ["OpenAI Codex"]
  notes: "Compared the statement interface with the published scope and original Lean declarations."
alignment:
  namespace: SplitGapIIIRegistry
  statements:
    - {source: "Sections 4 and 7, finite probabilistic recovery of the original gap", lean: SplitGapIIIRegistry.failure_probability_after_crossing_deletions, module: Challenge, status: proved}
    - {source: "Sections 3–4, recovery from bipartite host lists", lean: SplitGapIIIRegistry.recover_bipartite_physical_lists, module: Challenge, status: proved}
