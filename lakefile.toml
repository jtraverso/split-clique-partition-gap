name = "split_gap"
version = "0.1.0"
requiresModuleSystem = true
defaultTargets = ["SplitGap"]

[leanOptions]
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

[[lean_lib]]
name = "GapExtremal"
globs = ["GapExtremal.+"]

[[lean_lib]]
name = "GraphBase"
globs = ["GraphBase.+"]

[[lean_lib]]
name = "R417"
globs = ["R417.+"]

[[lean_lib]]
name = "R434"
globs = ["R434.+"]

[[lean_lib]]
name = "SplitGap"
